name: Staging KernelInterpolation
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install boost
      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: vcpkg install boost:x64-windows-static
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQL_BUILD_TEST_SUITE=ON -DQL_BUILD_EXAMPLES=OFF ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DBoost_USE_STATIC_LIBS=ON' || '' }}
      - name: Build tests
        run: cmake --build build --config Release --parallel 4 --target ql_test_suite
      - name: Kernel regressions
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            build/test-suite/Release/quantlib-test-suite.exe --run_test=QuantLibTests/InterpolationTests --report_level=short
          else
            build/test-suite/quantlib-test-suite --run_test=QuantLibTests/InterpolationTests --report_level=short
          fi
      - name: Full test suite
        if: runner.os == 'Linux'
        run: ctest --test-dir build --build-config Release --output-on-failure
